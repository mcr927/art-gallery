name: ArtGallery

options:
  bundleIdPrefix: com.mcr927.artgallery
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  GalleryPackage:
    path: LocalPackages/GalleryPackage

targetTemplates:
  App:
    type: application
    platform: iOS
    sources:
      - path: Sources/${target_name}
    dependencies:
      - package: GalleryPackage
        product: Models
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mcr927.artgallery.${target_name}
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"

targets:
  ModernGallery:
    templates: [App]
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: Modern Gallery