name: ArtGallery

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  GalleryPackage:
    path: LocalPackages/GalleryPackage

targetTemplates:
  App:
    type: application
    platform: iOS
    sources:
      - path: Sources/${target_name}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.${target_name}
        PRODUCT_NAME: ${target_name}
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ${target_name}
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    dependencies:
      - package: GalleryPackage
        product: ScreenArtworkList
      - package: GalleryPackage
        product: ScreenArtworkDetail
      - package: GalleryPackage
        product: APIClient
      - package: GalleryPackage
        product: Interfaces
      - package: GalleryPackage
        product: DesignSystem

targets:
  ModernGallery:
    templates:
      - App